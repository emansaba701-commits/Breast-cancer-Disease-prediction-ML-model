
<!DOCTYPE html>

<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Breast Cancer Prediction</title>

<style>

body {
    font-family: Arial, sans-serif;
    background: #f2f5f9;
    margin: 0;
    padding: 30px;
}

.container {
    max-width: 1000px;
    margin: auto;
    background: white;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.12);
}

h1 {
    text-align: center;
}

.subtitle {
    text-align: center;
    color: #666;
}

textarea {
    width: 100%;
    height: 130px;
    padding: 15px;
    font-size: 16px;
    border: 1px solid #ccc;
    border-radius: 8px;
    resize: vertical;
    box-sizing: border-box;
}

button {
    width: 100%;
    padding: 15px;
    margin-top: 20px;
    background: #007bff;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 18px;
    font-weight: bold;
}

.result {
    margin-top: 25px;
    padding: 20px;
    text-align: center;
    background: #e8f5e9;
    border-radius: 10px;
    font-size: 24px;
    font-weight: bold;
}

.error {
    margin-top: 20px;
    padding: 15px;
    background: #ffe6e6;
    color: red;
    border-radius: 8px;
}

</style>

</head>

<body>

<div class="container">

<h1>Breast Cancer Prediction</h1>

<p class="subtitle">
Enter all 30 features separated by commas
</p>

<form action="/predict" method="POST">

<textarea
    name="features"
    placeholder="17.99,10.38,122.8,1001,0.1184,0.2776,..."
    required
></textarea>

<button type="submit">
Predict
</button>

</form>

{% if prediction %}

<div class="result">
Prediction: {{ prediction }}
</div>

{% endif %}

{% if error %}

<div class="error">
Error: {{ error }}
</div>

{% endif %}

</div>

</body>

</html>
